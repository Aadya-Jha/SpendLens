AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SpendLens - AI-Powered AWS Cost Anomaly Explainer

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.11

Parameters:
  GroqApiKey:
    Type: String
    Description: Groq API key for AI explanations
    NoEcho: true
  AlertEmail:
    Type: String
    Description: Email address for cost anomaly alerts

Resources:

  # DynamoDB Table
  SpendLensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spendlens-alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: anomaly_id
          AttributeType: S
      KeySchema:
        - AttributeName: anomaly_id
          KeyType: HASH

  # SNS Topic
  SpendLensAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: spendlens-alerts-topic
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Lambda Function
  SpendLensFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spendlens-daily
      CodeUri: lambdas/
      Handler: lambda_function.lambda_handler
      Description: Fetches AWS cost anomalies and sends AI-powered alerts
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
          SNS_TOPIC_ARN: !Ref SpendLensAlertsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpendLensTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SpendLensAlertsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - ce:GetAnomalies
              Resource: '*'
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 * * ? *)
            Description: Run SpendLens daily at 8AM UTC
            Enabled: true

Outputs:
  SpendLensFunction:
    Description: Lambda Function ARN
    Value: !GetAtt SpendLensFunction.Arn
  SpendLensTable:
    Description: DynamoDB Table Name
    Value: !Ref SpendLensTable
  SpendLensAlertsTopic:
    Description: SNS Topic ARN
    Value: !Ref SpendLensAlertsTopic